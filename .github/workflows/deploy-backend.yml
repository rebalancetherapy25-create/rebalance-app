name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare SSH Key
        shell: bash
        run: |
          printf '%s' "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 --decode > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

      - name: Validate SSH Key
        run: |
          ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" > /dev/null
          echo "SSH key is valid"

      - name: Copy backend files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key_path: ${{ runner.temp }}/deploy_key
          source: "backend/"
          target: "~/"

      - name: Install Dependencies and Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            cd ~/backend
            npm install
            pm2 restart rebalance-backend --update-env
